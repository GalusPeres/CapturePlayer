name: Release Build

# Builds Windows (nsis + portable), Linux (AppImage x64) and macOS (dmg, Apple
# Silicon) packages. Stable tags use draft releases. Prerelease tags publish
# only after every platform passes; manual runs can opt into the same path.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_release:
        description: Publish a prerelease after all platform builds pass
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build native capture for the runner platform
        run: npm run native:build

      - name: Build Neural helpers without the NVIDIA model DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-neural.ps1 -HelpersOnly

      - name: Test portable native frame ownership
        if: runner.os != 'Windows'
        run: node scripts/test-portable-native.mjs

      - name: Test native texture delivery backpressure
        run: node scripts/test-portable-delivery.mjs

      - name: Verify HDR shaders on software GPU
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-neural-capture-color.ps1 -Warp

      - name: Test video-only capture and compatibility renderer
        if: runner.os == 'Windows'
        run: node scripts/test-capture-compatibility.mjs

      - name: Test audio recovery
        if: runner.os == 'Windows'
        run: node scripts/test-audio-recovery.mjs

      - name: Test production settings
        if: runner.os == 'Windows'
        run: node scripts/test-platform-settings.mjs

      - name: Test Neural preferences across restarts
        if: runner.os == 'Windows'
        run: node scripts/test-neural-preferences.mjs

      - name: Build renderer and electron bundles
        run: npm run build

      - name: Test production diagnostics across video modes
        if: runner.os == 'Windows'
        run: node scripts/test-diagnostics-overlay.mjs

      - name: Package and publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners have no signing certificate - ship unsigned builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Package without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref, '-') }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref, '-') }}
        uses: actions/upload-artifact@v4
        with:
          name: captureplayer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  publish-test-release:
    if: (github.event_name == 'workflow_dispatch' && inputs.test_release) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: captureplayer-*
          merge-multiple: true
          path: dist/test-release
      - name: Publish test packages without replacing the stable release
        run: node scripts/publish-test-release.mjs --replace-existing-prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
